name: Release

# release-please keeps a release PR open from the feat:/fix: commits on main.
# Merging it creates the GitHub release; this workflow then builds the image,
# pushes it to GHCR and deploys it via the self-hosted runner on the server.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image-Tag, der deployt wird (z.B. 1.2.0 für ein Rollback)"
        default: latest
      check_only:
        description: "Nur Checks auf dem Server (.env, Platz, Compose), nichts deployen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PR opened with GITHUB_TOKEN doesn't trigger CI, so the release PR
          # could never satisfy the required checks. A PAT avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ruben-sch/tt-hobbyturnier:${{ needs.release-please.outputs.version }}
            ghcr.io/ruben-sch/tt-hobbyturnier:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release-please, image]
    # Runs after a release, or by hand (redeploy, rollback, check only)
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.image.result == 'success')
    runs-on: [self-hosted, "${{ vars.DEPLOY_RUNNER_LABEL || 'hetzner' }}"]
    permissions:
      contents: read
      packages: read
    env:
      STACK_DIR: ${{ vars.STACK_DIR }}
      MIN_FREE_GB: ${{ vars.MIN_FREE_GB }}
      TAG: ${{ needs.release-please.outputs.version || inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: |
          [[ -n "$MIN_FREE_GB" ]] || unset MIN_FREE_GB
          if [[ "${{ inputs.check_only }}" == "true" ]]; then
            deploy/deploy.sh --check
          else
            deploy/deploy.sh "$TAG"
          fi
      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io
