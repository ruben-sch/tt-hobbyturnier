name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check .
      - run: pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-fail-under=95
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Docker image + deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server compose files are valid
        env:
          STACK: tt-turnier-staging
          IMAGE_TAG: staging
          APP_HOST: staging.turnier.example.de
          TT_ADMIN_PIN: ci-pin
        run: docker compose -f deploy/compose.yaml -f deploy/compose.staging.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tt-hobbyturnier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and is healthy
        run: |
          docker run -d --name tt -e TT_ADMIN_PIN=ci-pin -p 8000:8000 tt-hobbyturnier:ci
          for _ in $(seq 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' tt)"
            [[ "$status" == healthy ]] && break
            sleep 2
          done
          docker logs tt
          [[ "$status" == healthy ]] || { echo "::error::Container nicht healthy: $status"; exit 1; }
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS -H 'X-Admin-Pin: ci-pin' "http://localhost:8000/api/tournaments/$(curl -fsS http://localhost:8000/api/tournaments/active | jq .id)/admin-check"

  e2e:
    name: E2E (full tournament, 17 teams)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      # Screenshots after every round, plus screenshot and trace of a failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: frontend/e2e-results/
          retention-days: 14
