name: Deploy

# Same pattern as teamtafel: push on main -> staging, published release -> production.
# Repo secrets: HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY
# Secrets per GitHub environment (staging, production):
#   APP_HOST      subdomain, e.g. turnier.schwarzpost.de / staging.turnier.schwarzpost.de
#   TT_ADMIN_PIN  admin PIN of new tournaments (long and random, no quotes)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      is_release:
        description: Produktions-Release
        required: false
        type: boolean
        default: false
      tag:
        description: Release-Tag (z. B. v1.2.0)
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IS_RELEASE: ${{ github.event_name == 'release' || inputs.is_release == true }}
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: deploy-${{ github.event_name == 'release' || inputs.is_release == true }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' }}
            type=raw,value=staging,enable=${{ env.IS_RELEASE != 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || inputs.is_release == true) && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy-Dateien auf den Server kopieren
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "deploy/compose.yaml,deploy/compose.staging.yaml"
          target: "~/tt-turnier/"
          strip_components: 1

      - name: Container starten
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_ENV: ${{ env.IS_RELEASE == 'true' && 'production' || 'staging' }}
          APP_HOST: ${{ secrets.APP_HOST }}
          TT_ADMIN_PIN: ${{ secrets.TT_ADMIN_PIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_ENV,APP_HOST,TT_ADMIN_PIN,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            cd ~/tt-turnier

            if [ "$DEPLOY_ENV" = production ]; then
              STACK=tt-turnier; IMAGE_TAG=latest; FILES="-f compose.yaml"
            else
              STACK=tt-turnier-staging; IMAGE_TAG=staging; FILES="-f compose.yaml -f compose.staging.yaml"
            fi

            umask 077
            cat > ".env.$DEPLOY_ENV" <<EOF
            STACK=$STACK
            IMAGE_TAG=$IMAGE_TAG
            APP_HOST=$APP_HOST
            TT_ADMIN_PIN='$TT_ADMIN_PIN'
            EOF

            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -p "$STACK" --env-file ".env.$DEPLOY_ENV" $FILES pull
            docker compose -p "$STACK" --env-file ".env.$DEPLOY_ENV" $FILES up -d --wait
