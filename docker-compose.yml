# Local test of the production image: docker compose up --build -d
# The server deployment uses deploy/docker-compose.yml with the released image.
services:
  tt-turnier:
    build: .
    container_name: tt_hobbyturnier
    ports:
      - "8000:8000"
    volumes:
      - tt-data:/app/data
    environment:
      - TT_ADMIN_PIN=${TT_ADMIN_PIN:-}
    restart: unless-stopped

volumes:
  tt-data:
